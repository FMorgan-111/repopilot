[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "AI-powered GitHub issue → fix PR, with self-reflective agent loop"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Morgan Fu", email = "maogenfu0121@163.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiosqlite",
    "fastapi",
    "httpx",
    "pydantic",
    "python-dotenv",
    "tenacity",
    "uvicorn",
    "langgraph",
]

[project.optional-dependencies]
memory = [
    "fastembed>=0.8,<0.9",
    "numpy>=1.24,<3",
    "sqlite-vec>=0.1.9,<0.2",
]
eval = [
    "datasets>=3,<5",
    "swebench>=4.1,<5",
]
dev = [
    "fastembed>=0.8,<0.9",
    "numpy>=1.24,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "sqlite-vec>=0.1.9,<0.2",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/FMorgan-111/repopilot"
Repository = "https://github.com/FMorgan-111/repopilot"
Issues = "https://github.com/FMorgan-111/repopilot/issues"

[project.scripts]
repopilot = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
